name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build self-contained Windows app and installer
        run: python scripts/build_windows.py
      - name: Test install, bundled runtime and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/draft-kit-*-windows-x64-setup-unsigned-beta.exe | Select-Object -First 1
          python scripts/check_windows_installer.py $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: draft-kit-Windows-x64-unsigned-beta
          path: release/*
          if-no-files-found: error
          retention-days: 14
