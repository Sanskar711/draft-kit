name: Source checks
on:
  # A branch with an open pull request matched both triggers, so every push
  # ran the six-job matrix twice. Branches are covered by pull_request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Backend and portability checks
        # ci_pytest bounds the run itself. A job killed by timeout-minutes is
        # force-terminated and its log is discarded, which is why every hung
        # Windows run so far reported "cancelled" with nothing to read.
        # --timeout only covers test bodies, not collection or interpreter
        # exit, and needs the thread method because Windows has no SIGALRM.
        # -v names each test as it starts, so the log shows where it stopped.
        timeout-minutes: 10
        run: python scripts/ci_pytest.py -v --timeout=120 --timeout-method=thread
      - name: Install extension dependencies
        run: npm ci
      - name: Check and build extension
        run: |
          npm run typecheck
          npm run build
          npm run test:resume
      - name: Check the committed extension matches its sources
        run: git diff --exit-code -- extension/dist
      - name: Source startup and UI workflow
        env:
          COMPOSER_TEST_PYTHON: python
        run: npm run test:ui
